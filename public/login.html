<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FAFAF7">
  <title>Finanzas — Login</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FAFAF7; --paper:#FFFFFF; --line:#E8E6DF; --ink:#1A1814; --ink2:#5A5751; --ink3:#92908A;
      --accent:#1F3A2E; --gold:#9C7F4E; --red:#A63232; --red-bg:#F7E5E5;
      --shadow:0 4px 16px rgba(26,24,20,.06); --radius:14px;
      --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#15140F; --paper:#1A1813; --line:#2C2A23; --ink:#F4F1E8; --ink2:#C2BEAF; --ink3:#8E8B7F; --accent:#7DB69A; --gold:#D4B27A; --red:#E08080; --red-bg:#3A1F1F; }
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:36px 28px;width:100%;max-width:380px;box-shadow:var(--shadow)}
    h1{font-family:var(--display);font-size:32px;font-weight:500;letter-spacing:-1px;line-height:1.1;margin-bottom:6px}
    h1 em{font-style:italic;font-weight:400;color:var(--gold)}
    .sub{font-size:12px;color:var(--ink3);font-weight:500;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:28px}
    label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);margin-bottom:6px}
    input{width:100%;padding:13px 14px;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;font-family:var(--body);font-size:16px;color:var(--ink);outline:none;transition:.2s;font-weight:500}
    input:focus{border-color:var(--ink);background:var(--paper);box-shadow:0 0 0 3px rgba(26,24,20,.08)}
    button{width:100%;padding:14px;border:none;border-radius:8px;font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;transition:.2s;background:var(--ink);color:var(--paper);margin-top:18px}
    button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(26,24,20,.2)}
    button:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .err{color:var(--red);background:var(--red-bg);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:14px;display:none}
    .err.show{display:block}
  </style>
</head>
<body>
  <div class="card">
    <h1>Finanzas</h1>
    <div class="sub">Acceso privado</div>
    <form id="f" autocomplete="off">
      <label for="p">Contraseña</label>
      <input id="p" type="password" autocomplete="current-password" autofocus required>
      <button type="submit" id="btn">Entrar</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script>
    const f = document.getElementById('f');
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true; btn.textContent = '...';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('p').value })
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          throw new Error(d.error || 'Error');
        }
        location.href = '/';
      } catch (e) {
        err.textContent = e.message;
        err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
